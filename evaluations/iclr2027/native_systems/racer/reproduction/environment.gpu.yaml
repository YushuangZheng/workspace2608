# Server-B RACER compatibility environment for NVIDIA compute capability 12.0.
# Local editable sources and PyTorch3D are installed after creation; see the
# reproduction README for build variables and OFFICIAL_SOURCES.json for pins.
name: racer-official
channels:
  - nvidia
  - conda-forge
dependencies:
  - python=3.9.23
  - pip=26.0.1
  - setuptools=80.9.0
  - cffi=1.15.1
  - gym=0.21.0
  - cuda-nvcc=12.8.61
  - cuda-libraries-dev=12.8
  - pip:
      - --find-links=/home/ubuntu/workspace/_external/_wheels/faildetect-cu128
      - torch==2.7.1+cu128
      - torchvision==0.22.1+cu128
      - numpy==1.24.3
      - scipy==1.13.1
      - pandas==1.5.1
      - matplotlib==3.6.1
      - imageio==2.22.0
      - psutil==7.2.2
      - einops==0.4.1
      - tensorflow==2.15.1
      - transformers==4.44.2
      - opencv-python==4.11.0.86
      - opencv-python-headless==4.11.0.86
      - pyrender==0.1.45
      - hydra-core==1.3.2
      - omegaconf==2.2.3
      - yacs==0.1.8
      - tensorboard==2.15.2
      - tensorboardX==2.6.4
      - moviepy==1.0.3
      - decorator==4.4.2
      - natsort==8.4.0
      - pyquaternion==0.9.9
      - numpy-quaternion==2023.0.2
      - numba==0.60.0
      - llvmlite==0.43.0
      - fastapi==0.111.0
      - transforms3d==0.4.2
      - trimesh==4.12.2
      - timeout-decorator==0.5.0
      - ftfy==6.3.1
