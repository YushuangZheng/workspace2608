[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "essay2608"
version = "1.0.0"
description = "DynaMAC Algorithm 1 reproduction on R3 x S3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
baselines = ["torch>=2.1"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["source/essay2608"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
